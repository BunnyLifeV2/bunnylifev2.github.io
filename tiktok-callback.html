<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Bunny Life - TikTok connect</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px 16px;
         background: #f6f6f6; color: #1d1d1f; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px;
         box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  p { line-height: 1.5; }
  .code { font-family: ui-monospace, Consolas, monospace; background: #f0f0f0; border-radius: 8px;
          padding: 12px; word-break: break-all; margin: 12px 0; }
  button { font-size: 1rem; padding: 10px 18px; border: 0; border-radius: 8px; background: #111;
           color: #fff; cursor: pointer; }
  .ok { color: #0a7a32; } .bad { color: #b00020; }
</style>
</head>
<body>
<main>
  <h1>Bunny Life - TikTok connect</h1>
  <div id="result"><p>Reading the answer from TikTok...</p></div>
  <p style="font-size:.85rem;color:#666">This page only shows what TikTok put in its address.
  It sends nothing anywhere and keeps nothing.</p>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var box = document.getElementById("result");
  var code = params.get("code");
  var state = params.get("state");
  var error = params.get("error");
  box.textContent = "";
  function line(text, cls) {
    var p = document.createElement("p");
    p.textContent = text;
    if (cls) { p.className = cls; }
    box.appendChild(p);
  }
  if (error || !code) {
    line("TikTok did not give a code: " + (params.get("error_description") || error || "no code in the address") + ".", "bad");
    line("Close this page and run connect_tiktok.py again.");
    return;
  }
  var answer = new URLSearchParams({ code: code, state: state || "" }).toString();
  line("TikTok gave a code. Press Copy, go back to the PowerShell window, paste it and press Enter.", "ok");
  var shown = document.createElement("div");
  shown.className = "code";
  shown.textContent = answer;
  box.appendChild(shown);
  var button = document.createElement("button");
  button.type = "button";
  button.textContent = "Copy";
  button.addEventListener("click", function () {
    var done = function () { button.textContent = "Copied"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(answer).then(done, function () { select(); });
    } else { select(); }
    function select() {
      var range = document.createRange();
      range.selectNodeContents(shown);
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      document.execCommand("copy");
      done();
    }
  });
  box.appendChild(button);
  // The code is in the address bar only for this one page; it is removed so a
  // reload or a bookmark does not keep it.
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, "", window.location.pathname);
  }
})();
</script>
</body>
</html>
